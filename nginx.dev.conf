events {}

http {
    include mime.types;
    
    upstream backend_rag_cluster {
        server backend-rag:8000;
    }

    server {
        listen 80;
        server_name localhost; 

        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html;
        }

        location /api/ {
            proxy_pass http://backend_rag_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}