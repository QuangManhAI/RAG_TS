events {
    worker_connections 1024;
}

http {
    include mime.types;

    upstream backend_rag_cluster {
        server backend-rag:8000 max_fails=3 fail_timeout=30s; # 'backend-rag' là tên service trong Docker
    }

    server {
        listen 80;
        server_name tenmien.com www.tenmien.com;
        return 301 https://$host$request_uri; 
    }

    server {
        listen 443 ssl;
        server_name tenmien.com www.tenmien.com;

        ssl_certificate "/etc/nginx/ssl/cert.pem";
        ssl_certificate_key "/etc/nginx/ssl/key.pem";

        access_log /var/log/nginx/rag_access.log;
        error_log /var/log/nginx/rag_error.log warn;

        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;

        location / {
            root "/usr/share/nginx/html"; 
            try_files $uri /index.html; 
        }

        location /api/ {
            proxy_pass http://backend_rag_cluster;
            
            proxy_redirect off;
            proxy_buffering off;
            
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Hỗ trợ WebSockets
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}